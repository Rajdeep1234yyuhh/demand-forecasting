env: dev

data:
  raw_prefix: raw/m5
  processed_prefix: processed/m5
  # In-cluster training runs on one state to fit the free-tier node budget.
  # Set to null for full-dataset training (run locally).
  train_subset_state: CA

forecast:
  horizon_days: 28
  quantiles: [0.5, 0.9, 0.95]
  backtest_folds: 3
